<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>MUO 2026/2027</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div id ="menu">
        <h1>Menu</h1>

        <div class ="middle">
            <button type ="button" id ="addNewIcon" class ="iconButton">
                <img src="icons/folder-plus-solid-full.svg" id ="addSmthing" alt=""></img>
            </button>
        </div>

        <div id ="output" class="middle"></div>
       
    </div>

    <div id ="upload">

        <h1>Vyber soubor:</h1>

        <button type="button" class = "iconGetBack" id="getBackUpload">
            <img src="icons/arrow-left-solid-full.svg" alt="" class="sizethree"></img>
        </button>

        <div class ="withoutBox">
            <div id = "nameTag">Jméno témata</div>
            <input id = "textInput" placeholder="např. technologie" class="fillerBox" maxlength="16">
        </div>

        <div class="withoutBox2">
            <input type="file" id = "fileInput" class="fileBox">

            <button type="button" id="fileOverlay" class="eniszwei">
                <img src="icons/box-archive-solid-full.svg" id ="addFileButton" alt="" class="adaptImageFirst"></img>
                Přidat soubor ".zip"
            </button>
        </div>

        <div class ="left">
            <button type ="button" id ="check" class ="iconButton">
                <img src="icons/circle-check-regular-full.svg" id="hablahabla" class="sizefive"></img>
            </button>
        </div>
    </div>

    <div id ="fileLooker">
        <h1 id="TestingName">Testing</h1>

        <button type="button" class = "iconGetBack" id="getBackFileLooker">
            <img src="icons/arrow-left-solid-full.svg" alt="" class="sizethree"></img>
        </button>

        <div id="lookTroughAll"></div>

        <div id="statsBar">
            <div id="numberShowcase"></div>

            <div id="showcaseBar"></div>

            <div id="greenDIV">
                <div id="greenDIVUNDER"></div>umím
            </div>
            <div id="orangeDIV">
                <div id="orangeDIVUNDER"></div>nejistý
            </div>
            <div id="redDIV">
                <div id="redDIVUNDER"></div>neumím
            </div>
            <div id="lightgrayDIV">
                <div id="lightgrayDIVUNDER"></div>neznám
            </div>

            <button type="button" id="exportProgressFile">
                <div class="insideProgressWhatever">
                    Export statistik
                </div>
                <img src="icons/file-export-solid-full.svg" class = "changeProgressIcons sizeoneeight" alt=""></img>
            </button>

            <button type="button" id="importProgressFile">
                <div class="insideProgressWhatever">
                    Import statistik
                </div>
                <img src="icons/file-import-solid-full.svg" class="changeProgressIcons sizeoneeight" alt=""></img>
                <input type="file" id="importProgressInput" hidden>              
            </button>

            <button type="button"id="deleteProgress">
                <div class="insideProgressWhatever">
                    Odstranit statistiky
                </div>
                <img src="icons/delete-left-solid-full.svg" class="changeProgressIcons sizeoneeight" alt=""></img>
            </button>

            <button type="button"id="deleteTopicus">
                <div class="insideProgressWhatever">
                Odstranit téma
                </div>
                <img src="icons/trash-solid-full.svg" class="changeProgressIcons sizeoneeight" alt=""></img>
            </button>        
        </div>


    </div>

    <div id = "questionPage">
        <button type="button" class = "iconGetBack" id="getBackToAll">
            <img src="icons/arrow-left-solid-full.svg" alt="" class="sizethree"></img>
        </button>

        <div id="questionFrame">
           <div id="questionHead" class="questionHeadClass"></div>
           <div id="imageFrame"></div>
        </div>

        <button type="button" id="WithStar">
        </button>

        <div id="answersTable"></div>

        <button type ="button" class ="iconGetNext" id="goToNextQu">
            <img src="icons/chevron-right-solid-full.svg" class="sizethree" alt=""></img>
        </button>

        <button type="button" class ="iconGetBack2" id="goToLastQu">
            <img src="icons/chevron-left-solid-full.svg" class="sizethree" alt=""></img>
        </button>

        <div class="sliderContainer">
            <div class="sliderTrack"></div>

            <input type="range" id="topicsSlider" min="0" value="0" max="50">
        </div>
    </div>

    <button type="button" id="darkMode">
        
    </button>

    <div id="confirmationOverlay">
        <div id="confirmationBox">
        </div>
    </div>

    <script src="papaparse.min.js"></script>
    <script src="jszip.min.js"></script>
    <script src = "script.js?v=1.3"></script>
    <script src = "css-setup.js"></script>

    <script type="text/javascript">
        if("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/MUO-V1/service-worker.js")
            .then(() =>console.log("serviceWorker not registered"))
            .catch((error)=>console.log("serviceWorker failed", error));
        }
    </script>
</body>
</html>
